<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="{{ t.meta_description }}" />
    <title>{% block title %}Lyract{% endblock %} | {{ t.title_suffix }}</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/profile.jpg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">{{ t.skip }}</a>
    <header class="site-header">
      <a class="wordmark" href="{{ url_for('home') }}" aria-label="{{ t.brand_aria }}">LYRACT<span>.</span></a>
      <nav aria-label="{{ t.nav_label }}">
        <a class="{% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">{{ t.nav_home }}</a>
        <a class="{% if request.endpoint == 'commands' %}active{% endif %}" href="{{ url_for('commands') }}">{{ t.nav_commands }}</a>
        <a class="{% if request.endpoint == 'guide' %}active{% endif %}" href="{{ url_for('guide') }}">{{ t.nav_guide }}</a>
        <a class="{% if request.endpoint == 'about' %}active{% endif %}" href="{{ url_for('about') }}">{{ t.nav_about }}</a>
      </nav>
      <div class="header-actions">
        <a class="language-switch" href="{{ url_for(request.endpoint or 'home', lang='en' if lang == 'id' else 'id') }}" lang="{{ 'en' if lang == 'id' else 'id' }}" aria-label="{{ t.switch_language }}">{{ t.language_target }}</a>
        <a class="button button-small" href="{{ url_for('invite') }}">{{ t.invite_bot }}</a>
      </div>
    </header>

    <main id="main">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <a class="wordmark" href="{{ url_for('home') }}">LYRACT<span>.</span></a>
      <p>{{ t.footer_tagline }}</p>
      <a href="{{ url_for('commands') }}">{{ t.footer_commands }}</a>
      <small>{{ t.copyright }}</small>
    </footer>
    <script src="{{ url_for('static', filename='wheel-scroll.js') }}" defer></script>
  </body>
</html>
